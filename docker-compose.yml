services:
  chat-service:
    build: .
    container_name: chat-service
    ports:
      - "9095:9095"
    environment:
      - APP_ENV=production
      # user-service 对接：Docker 同网络内用服务名 user-service；若 user-service 在外部则改实际地址
      - USER_SERVICE_URL=http://user-service:8000
      - JWKS_CACHE_TTL_SECONDS=3600
      # superuser 三重 AND 校验：role=superuser + username 匹配 + user_id 匹配，缺一不可
      # 部署时请将 SUPERUSER_USER_IDS 改为 user-service 中实际 superuser 的 ID
      - SUPERUSER_USERNAMES=["superuser"]
      - SUPERUSER_USER_IDS=[1]
      # 服务名白名单：非 superuser 请求必须命中，否则 403
      - ALLOWED_SERVICE_NAMES=["default"]
      # Redis 为外部接入：填 Redis 提供方给出的连接 URL（云 Redis / 自建实例均可）
      - REDIS_URL=redis://localhost:6379/0
      # PydanticAI：DeepSeek 官方端点（api.deepseek.com），填实际 DeepSeek API Key
      - AI_PROVIDER=deepseek
      - AI_MODEL_NAME=deepseek-chat
      - AI_API_KEY=
      # AI_ENABLED_TOOLS=["*"] 启用全部注册 tool；可改为具体名单，[] 全部禁用
      - AI_ENABLED_TOOLS=["*"]
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9095/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
